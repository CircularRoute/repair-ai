<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101418">
  <title>Repair AI - Sign in</title>
  <link rel="manifest" href="/admin/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/admin/styles.css">
</head>
<body>
  <main class="login-wrap">
    <div class="login-card">
      <div class="brand">
        <span class="brand-dot"></span>
        <h1>Repair AI</h1>
      </div>
      <p class="muted">Admin sign in. Paste your admin token once on this device; you stay signed in.</p>
      <form id="login-form">
        <input id="token" type="password" autocomplete="current-password" placeholder="Admin token" required>
        <button type="submit">Sign in</button>
      </form>
      <p id="login-error" class="error" hidden>That token was not accepted.</p>
    </div>
  </main>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('login-error');
      errEl.hidden = true;
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: document.getElementById('token').value }),
      });
      if (res.ok) { location.href = '/admin'; } else { errEl.hidden = false; }
    });
  </script>
</body>
</html>
