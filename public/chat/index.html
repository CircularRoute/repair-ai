<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#101418">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Repair AI</title>
  <link rel="manifest" href="/chat/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/chat/styles.css">
</head>
<body>
  <header class="chat-top">
    <div class="brand">
      <span class="brand-dot"></span>
      <h1>Repair AI</h1>
    </div>
    <div class="top-actions">
      <a id="admin-link" class="ghost-link" href="/admin" hidden>Admin</a>
      <button id="signout-btn" class="ghost-link as-button">Sign out</button>
    </div>
  </header>

  <div id="push-banner" class="push-banner" hidden>
    <div id="push-banner-text">Turn on notifications so you never miss a message. It is a key part of this group.</div>
    <button id="push-enable">Enable notifications</button>
  </div>

  <main id="messages" class="messages"></main>

  <footer class="composer">
    <label class="attach" title="Attach a file">
      <input id="file-input" type="file"
        accept=".jpg,.jpeg,.png,.gif,.webp,.heic,.m4a,.mp3,.wav,.webm,.ogg,.mp4,.mov,.pdf,.txt,.csv,.docx,.xlsx">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.4 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.2-9.19a4 4 0 015.65 5.66l-9.2 9.19a2 2 0 01-2.82-2.83l8.49-8.48"/></svg>
    </label>
    <textarea id="text-input" rows="1" placeholder="Message"></textarea>
    <button id="send-btn" class="round" title="Send" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
    <button id="mic-btn" class="round" title="Record a voice note">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 14a3 3 0 003-3V6a3 3 0 10-6 0v5a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 006 6.92V21h2v-3.08A7 7 0 0019 11h-2z"/></svg>
    </button>
  </footer>

  <div id="rec-bar" class="rec-bar" hidden>
    <span class="rec-dot"></span>
    <span id="rec-time">0:00</span>
    <button id="rec-cancel" class="ghost">Cancel</button>
    <button id="rec-send">Send</button>
  </div>

  <script src="/chat/app.js"></script>
</body>
</html>
